<div class="loader-card">
  <div class="loader-brand">
    <img [src]="logoSrc()" alt="BeyondAI logo" class="loader-logo" aria-hidden="true">
    <!-- Branding text hidden for the research deployment — the study should stay blind to
         which tool/vendor this is. Uncomment if a non-study build needs it back.
    <h1 class="loader-title">BeyondAI</h1>
    <p class="loader-subtitle">Code Review Assistant</p>
    -->
  </div>

  <!-- Same reasoning: hides the "Code Review AI" product name/description from participants.
  <h1 class="title">{{ t().loaderTitle }}</h1>
  <p class="subtitle">{{ t().loaderSubtitle }}</p>
  -->

  @if (errorMessage()) {
    <div class="error-banner" role="alert">
      {{ errorMessage() }}
    </div>
  }

  @if (allDone()) {
    <div class="done-banner" role="status">
      ✓ {{ t().studyAllDone }}
    </div>
  }

  <form (ngSubmit)="login()" novalidate>
    <div class="field">
      <label for="participantId">{{ t().studyParticipantLabel }}</label>
      <input
        id="participantId"
        type="text"
        name="participantId"
        [ngModel]="participantId()"
        (ngModelChange)="participantId.set($event); onIdInput()"
        [placeholder]="t().studyParticipantPlaceholder"
        autocomplete="off"
        maxlength="50"
      />
    </div>

    <div class="field">
      <label>{{ t().studyLangLabel }}</label>
      <div class="lang-cards">
        <button
          type="button"
          class="lang-card"
          [class.lang-card--active]="i18n.lang() === 'sr'"
          (click)="setLang('sr')"
        >SR — Srpski</button>
        <button
          type="button"
          class="lang-card"
          [class.lang-card--active]="i18n.lang() === 'en'"
          (click)="setLang('en')"
        >EN — English</button>
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner" aria-hidden="true"></span>
        {{ t().loading }}
      } @else {
        {{ t().studyLogin }}
      }
    </button>
  </form>
</div>
